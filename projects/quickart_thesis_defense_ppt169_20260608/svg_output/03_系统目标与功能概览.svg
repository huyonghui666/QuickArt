<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topBarGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00A8A8"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
    <rect x="0" y="0" width="1280" height="6" fill="url(#topBarGradient)"/>
  </g>

  <g id="header">
    <text x="40" y="54" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="36" font-weight="700" fill="#1F2937">QuickArt 面向移动端 AIGC 创作，构建“生成—管理—分享—支付”完整闭环</text>
    <rect x="40" y="74" width="1200" height="44" rx="10" fill="#1565C0"/>
    <text x="60" y="103" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#FFFFFF">系统不是单一功能演示，而是覆盖创作、任务管理、结果查看与支付积分的一体化业务系统。</text>
  </g>

  <g id="left-content">
    <rect x="40" y="145" width="420" height="500" rx="18" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>

    <g id="goal-block">
      <use data-icon="chunk-filled/target" x="70" y="178" width="28" height="28" fill="#1565C0"/>
      <text x="112" y="200" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#1F2937">系统目标</text>
      <text x="70" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2937">
        以 Flutter 实现跨平台移动端，
        <tspan x="70" dy="34">以 Spring Boot + Kotlin 提供后端服务，</tspan>
        <tspan x="70" dy="34">以多模型接入支撑图像与视频生成。</tspan>
      </text>
    </g>

    <g id="ability-block">
      <use data-icon="chunk-filled/image" x="70" y="340" width="28" height="28" fill="#00A8A8"/>
      <text x="112" y="362" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#1F2937">核心能力</text>
      <text x="70" y="405" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2937">文生图、图生图、文生视频、</text>
      <text x="70" y="439" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2937">图生视频、AI换脸</text>
    </g>

    <g id="closure-block">
      <use data-icon="chunk-filled/checkmark" x="70" y="505" width="28" height="28" fill="#5C6BC0"/>
      <text x="112" y="527" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#1F2937">业务闭环</text>
      <text x="70" y="568" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2937">认证登录、工作室管理、结果分享、</text>
      <text x="70" y="602" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2937">积分购买与支付回调</text>
    </g>
  </g>

  <g id="right-visual">
    <rect x="500" y="145" width="740" height="500" rx="18" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <image href="../images/thesis__image_012.png" x="525" y="175" width="690" height="400" preserveAspectRatio="xMidYMid meet"/>
    <rect x="525" y="590" width="690" height="35" rx="8" fill="#EEF4FB"/>
    <text x="870" y="613" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1565C0">论文图4-2：系统功能模块图，用于说明整体功能边界</text>
  </g>

  <g id="footer">
    <text x="58" y="690" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#94A3B8">功能页强调“完整业务闭环”，而不是只展示几个 AI 功能点</text>
    <text x="1220" y="690" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#94A3B8">03</text>
  </g>
</svg>